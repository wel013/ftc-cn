# .github/workflows/apply_corrections.yml
# ─────────────────────────────────────────
# Manually triggered workflow that:
#   1. Runs apply_corrections.py
#   2. Commits the updated ftc_teams.json + corrections.csv back to the repo
#
# How to run:
#   GitHub repo → Actions tab → "Apply Corrections" → Run workflow

name: Apply Corrections

on:
  workflow_dispatch:   # manual trigger only — you run it when you're ready

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install geopy

      - name: Run apply_corrections.py
        run: python apply_corrections.py

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ftc_teams.json corrections.csv
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "Apply approved location corrections [skip ci]"
          git push